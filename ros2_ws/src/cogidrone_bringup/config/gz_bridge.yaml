# Gazebo -> ROS 2 topic bridge (ros_gz_bridge parameter_bridge).
# ROS topic names match what realsense-ros publishes on the real D435i, so the
# perception code runs unchanged on the drone.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /camera/camera/color/image_raw
  gz_topic_name: /cogidrone/camera/color/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera/camera/color/camera_info
  gz_topic_name: /cogidrone/camera/color/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# Depth is off by default: Gazebo only renders a camera someone subscribes to, and
# depth rendering is expensive on CPU. Uncomment when a node needs it.
